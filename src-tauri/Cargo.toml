[package]
name = "workspace-cleaner"
version = "0.1.0"
description = "Safely find and trash generated project folders"
authors = ["Workspace Cleaner"]
edition = "2021"

[lib]
name = "workspace_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
trash = "5"
